name: Valid Links

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    # Run once a week
    - cron: "0 0 * * 0"

permissions:
  contents: read
  issues: write

jobs:
  link-checker:
    name: Check Link Validity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build URL list from live sitemap
        run: |
          set -euo pipefail
          curl -sf https://ky.fyi/sitemap-index.xml \
            | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g' \
            | while read -r sitemap; do
                curl -sf "$sitemap" | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g'
              done > urls.txt
          echo "README.md" >> urls.txt
          cat urls.txt

      - name: Run Lychee
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--no-progress --config .lychee.toml --files-from urls.txt"

      - name: Create Issue From File
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: automated

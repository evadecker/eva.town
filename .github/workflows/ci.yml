name: CI

env:
  TURSO_CONNECTION_URL: ${{ secrets.TURSO_CONNECTION_URL }}
  TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "**/*.mdx"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "**/*.mdx"]

jobs:
  format:
    name: Biome
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Cache LilyPond
        id: cache-lilypond
        uses: actions/cache@v6
        with:
          path: ~/lilypond-2.26.0
          key: lilypond-2.26.0-linux-x86_64

      - name: Install LilyPond
        if: steps.cache-lilypond.outputs.cache-hit != 'true'
        run: |
          curl -sL -o /tmp/lilypond.tar.gz "https://gitlab.com/lilypond/lilypond/-/releases/v2.26.0/downloads/lilypond-2.26.0-linux-x86_64.tar.gz"
          tar xzf /tmp/lilypond.tar.gz -C "$HOME"

      - name: Add LilyPond to PATH
        run: echo "$HOME/lilypond-2.26.0/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm i

      - name: Check for lint and formatting errors with Biome
        run: pnpm check

  test:
    name: Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Cache LilyPond
        id: cache-lilypond
        uses: actions/cache@v6
        with:
          path: ~/lilypond-2.26.0
          key: lilypond-2.26.0-linux-x86_64

      - name: Install LilyPond
        if: steps.cache-lilypond.outputs.cache-hit != 'true'
        run: |
          curl -sL -o /tmp/lilypond.tar.gz "https://gitlab.com/lilypond/lilypond/-/releases/v2.26.0/downloads/lilypond-2.26.0-linux-x86_64.tar.gz"
          tar xzf /tmp/lilypond.tar.gz -C "$HOME"

      - name: Add LilyPond to PATH
        run: echo "$HOME/lilypond-2.26.0/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm i

      - name: Install Playwright
        run: pnpm exec playwright install chromium

      - name: Run Playwright tests
        run: pnpm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
